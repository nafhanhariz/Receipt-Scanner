<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 16px;
        margin: 0;
        color: #202124;
        background-color: #ffffff;
      }
      .card {
        border: 2px dashed #1a73e8;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        background-color: #f8f9fa;
        margin-bottom: 16px;
      }
      .btn {
        background-color: #1a73e8;
        color: white;
        border: none;
        padding: 12px 16px;
        border-radius: 4px;
        width: 100%;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #1557b0;
      }
      .btn:disabled {
        background-color: #dadce0;
        cursor: not-allowed;
      }
      #preview {
        max-width: 100%;
        max-height: 200px;
        border-radius: 4px;
        display: none;
        margin: 12px auto 0;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        color: #5f6368;
        text-align: center;
      }
      .file-input {
        display: none;
      }
      .input-label {
        display: block;
        color: #1a73e8;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h3>🧾 Receipt Scanner</h3>
    
    <div class="card">
      <label class="input-label" for="cameraInput">Take Photo with Camera</label>
      <input type="file" id="cameraInput" class="file-input" accept="image/*" capture="environment" onchange="handleFileSelect(this)">
      
      <p style="margin: 8px 0; font-size: 12px; color: #70757a;">— OR —</p>
      
      <label class="input-label" for="fileInput">📁 Upload Existing Image</label>
      <input type="file" id="fileInput" class="file-input" accept="image/*,application/pdf" onchange="handleFileSelect(this)">
      
      <img id="preview" alt="Receipt Preview">
    </div>

    <button id="submitBtn" class="btn" onclick="processSelectedFile()" disabled>Scan & Extract</button>
    <div id="status">Select an option above to start.</div>

    <script>
      let selectedFileData = null;

      function handleFileSelect(inputElement) {
        const file = inputElement.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
          const fullDataUrl = e.target.result;
          const base64Data = fullDataUrl.split(',')[1];
          
          selectedFileData = {
            base64: base64Data,
            name: file.name || "camera_capture.jpg",
            mimeType: file.type || "image/jpeg"
          };

          // Show preview if it's an image
          if (file.type.startsWith('image/')) {
            const previewImg = document.getElementById('preview');
            previewImg.src = fullDataUrl;
            previewImg.style.display = 'block';
          }

          document.getElementById('submitBtn').disabled = false;
          document.getElementById('status').innerText = 'Ready to parse: ' + selectedFileData.name;
        };
        reader.readAsDataURL(file);
      }

      function processSelectedFile() {
        if (!selectedFileData) return;

        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        status.innerText = '⏳ Processing with Gemini AI... Please wait.';

        // Call backend Google Apps Script function
        google.script.run
          .withSuccessHandler(function(response) {
            status.innerText = '✅ Success!';
            btn.disabled = false;
            // Reset input and preview
            document.getElementById('preview').style.display = 'none';
            selectedFileData = null;
          })
          .withFailureHandler(function(error) {
            status.innerText = '❌ Error: ' + error.message;
            btn.disabled = false;
          })
          .processUploadedBlob(selectedFileData.base64, selectedFileData.name, selectedFileData.mimeType);
      }
    </script>
  </body>
</html>
